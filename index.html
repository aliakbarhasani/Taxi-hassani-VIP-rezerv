<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو آنلاین تاکسی حسنی VIP</title>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a2e36, #05161a);
            font-family: tahoma, sans-serif;
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 540px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 242, 254, 0.15);
            animation: show .8s ease;
        }

        @keyframes show {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            padding: 40px 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #00f2fe;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .header h1 {
            margin: 0;
            color: #00f2fe;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0, 242, 254, 0.3);
        }

        .header p {
            color: #e0e0e0;
            margin-top: 12px;
            line-height: 1.8;
            font-size: 19px;
            font-weight: bold;
        }

        #clock {
            margin-top: 15px;
            font-size: 18px;
            color: #00f2fe;
            font-weight: bold;
        }

        .car {
            width: 100%;
            height: 280px;
            background: url('logo.jpg') center/cover no-repeat;
            position: relative;
        }

        .car::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10, 46, 54, 0.9), transparent);
        }

        .form-box {
            padding: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #00f2fe;
            font-size: 17px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 16px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            color: white;
            box-sizing: border-box;
            font-size: 17px;
            transition: .3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border: 1px solid #00f2fe;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        select option {
            background: #0a2e36;
            color: white;
        }

        textarea {
            resize: none;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.2));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.4);
            padding: 18px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.15);
            text-shadow: 0 1px 5px rgba(0, 242, 254, 0.3);
            margin-top: 10px;
        }

        .btn:hover {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.4), rgba(79, 172, 254, 0.4));
            color: white;
            border: 1px solid #00f2fe;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
            transform: translateY(-2px);
        }

        .info {
            padding: 30px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            font-size: 18px;
            font-weight: bold;
        }

        .number {
            font-size: 22px;
            color: #00f2fe;
            font-weight: bold;
            margin-top: 8px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .call-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 14px 30px;
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.3);
            text-decoration: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            transition: .3s;
        }

        .call-btn:hover {
            background: #00f2fe;
            color: black;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            transform: scale(1.05);
        }

        .site-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 14px 30px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-decoration: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            transition: .3s;
        }

        .site-btn:hover {
            background: white;
            color: black;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .share-box {
            margin-top: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .share-box p {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: #a0a0a0;
        }

        .share-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .share-link {
            flex: 1;
            padding: 10px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
            text-align: center;
        }

        .share-wa { background: rgba(37, 211, 102, 0.2); border: 1px solid #25d366; color: #25d366; }
        .share-tg { background: rgba(0, 136, 204, 0.2); border: 1px solid #0088cc; color: #0088cc; }
        .share-wa:hover { background: #25d366; color: white; }
        .share-tg:hover { background: #0088cc; color: white; }

        .footer {
            text-align: center;
            color: #a0a0a0;
            font-size: 15px;
            margin-top: 25px;
            line-height: 1.8;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 65px;
            height: 65px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            text-decoration: none;
            color: white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            z-index: 999;
            transition: .3s;
        }

        .whatsapp-float:hover { transform: scale(1.1) rotate(10deg); }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <img src="logo.png" class="logo">
            <h1>تاکسی VIP حسنی</h1>
            <p>سفر راحت، سریع و مطمئن<br>هرات ← مشهد</p>
            <div id="clock"></div>
        </div>

        <div class="car"></div>

        <div class="form-box">
            <label>نام و نام خانوادگی</label>
            <input type="text" id="name" placeholder="نام کامل">

            <label>شماره تماس</label>
            <input type="tel" id="phone" placeholder="0780xxxxxx">

            <label>مسیر سفر</label>
            <select id="route">
                <option value="هرات-مشهد">هرات ← مشهد</option>
                <option value="مشهد-هرات">مشهد ← هرات</option>
            </select>

            <label>تعداد مسافر</label>
            <select id="passengers">
                <option value="1">1 نفر</option>
                <option value="2">2 نفر</option>
                <option value="3">3 نفر</option>
                <option value="4">4 نفر</option>
            </select>

            <label>نوع خودرو</label>
            <select id="carType">
                <option value="معمولی">VIP معمولی</option>
                <option value="لوکس">VIP لوکس</option>
                <option value="ون">ون خانوادگی</option>
            </select>

            <label>تاریخ حرکت</label>
            <input type="date" id="date">

            <label>محل دقیق سوار شدن (لوکیشن / آدرس)</label>
            <textarea id="address" rows="3" placeholder="آدرس دقیق یا لینک نقشه گوگل مپ..."></textarea>

            <button class="btn" onclick="sendToWhatsApp()">ثبت رزرو در واتساپ</button>

            <div class="share-box">
                <p>این سایت را با دوستان خود به اشتراک بگذارید:</p>
                <div class="share-btns">
                    <a href="https://api.whatsapp.com/send?text=برای%20رزرو%20آنلاین%20تاکسی%20VIP%20هرات%20مشهد%20به%20سایت%20زیر%20مراجعه%20کنید:%20https://taxi-herat-mashhad-hassani.netlify.app" target="_blank" class="share-link share-wa">اشتراک در واتساپ</a>
                    <a href="https://telegram.me/share/url?url=https://taxi-herat-mashhad-hassani.netlify.app&text=رزرو%20آنلاین%20تاکسی%20VIP%20حسنی" target="_blank" class="share-link share-tg">اشتراک در تلگرام</a>
                </div>
            </div>
        </div>

        <div class="info">
            افغانستان 🇦🇫
            <div class="number">0780889098</div>
            ایران 🇮🇷
            <div class="number">09351023670</div>

            <a href="tel:+93780889098" class="call-btn">📞 تماس مستقیم</a>
            <br>
            <a href="https://sites.google.com/view/taxi-herat-mashhad-hassani" target="_blank" class="site-btn">🌐 ورود به سایت رسمی</a>

            <div class="footer">
                تاکسی بین‌المللی هرات مشهد حسنی<br>سفر ایمن، سریع و VIP بین هرات و مشهد
            </div>
        </div>

    </div>

    <a href="https://wa.me/93780889098" class="whatsapp-float" target="_blank">💬</a>

    <script>
        setInterval(() => {
            let now = new Date();
            document.getElementById("clock").innerHTML = now.toLocaleTimeString("fa-IR");
        }, 1000);

        function sendToWhatsApp() {
            let name = document.getElementById("name").value;
            let phone = document.getElementById("phone").value;
            let route = document.getElementById("route").value;
            let passengers = document.getElementById("passengers").value;
            let carType = document.getElementById("carType").value;
            let date = document.getElementById("date").value;
            let address = document.getElementById("address").value;

            if (name === "" || phone === "" || date === "") {
                alert("لطفاً اطلاعات ضروری را کامل کنید");
                return;
            }

            let message = ✨ رزرو جدید تاکسی VIP\n\n👤 نام:\n${name}\n\n📞 شماره تماس:\n${phone}\n\n🗺️ مسیر:\n${route === 'هرات-مشهد' ? 'هرات ← مشهد' : 'مشهد ← هرات'}\n\n👥 تعداد مسافر:\n${passengers} نفر\n\n🚗 نوع خودرو:\nVIP ${carType}\n\n📅 تاریخ حرکت:\n${date}\n\n📍 لوکیشن یا آدرس دقیق:\n${address || 'ثبت نشده'}\n\n🌐 سایت رسمی:\nhttps://sites.google.com/view/taxi-herat-mashhad-hassani;

            let whatsappURL = "https://wa.me/93780889098?text=" + encodeURIComponent(message);
            window.open(whatsappURL, "_blank");
        }
    </script>
</body>
</html>
