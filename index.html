<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو آنلاین تاکسی حسنی VIP</title>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            /* تم روشن، شاد و جوان‌پسند */
            background: linear-gradient(135deg, #e0f7fa, #fffaf0);
            font-family: tahoma, sans-serif;
            color: #1a3a3a;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 540px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(0, 150, 136, 0.2);
            box-shadow: 0 15px 35px rgba(0, 150, 136, 0.15);
            animation: show .8s ease;
        }

        @keyframes show {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(to bottom, #009688, #00796b);
            color: white;
            border-bottom: 2px solid #004d40;
        }

        .logo {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 34px;
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header p {
            color: #e0f2f1;
            margin-top: 12px;
            line-height: 1.8;
            font-size: 19px;
            font-weight: bold;
        }

        #clock {
            margin-top: 15px;
            font-size: 18px;
            color: #ffd54f;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.15);
            display: inline-block;
            padding: 4px 15px;
            border-radius: 20px;
        }

        .car {
            width: 100%;
            height: 260px;
            background: url('logo.png') center/cover no-repeat;
            position: relative;
        }

        /* خط جداکننده ضخیم و سفید بالای فرم برای عدم تداخل با تصویر */
        .form-box {
            padding: 30px;
            background: #ffffff;
            border-top: 5px solid #009688;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #004d40;
            font-size: 16px;
            font-weight: bold;
        }

        /* استایل جدید کادرها: پس‌زمینه سبز روشن ملایم و رنگ متن سیاه */
        input, select, textarea {
            width: 100%;
            padding: 16px;
            margin-bottom: 22px;
            border: 2px solid #b2dfdb;
            border-radius: 14px;
            background-color: #e8f5e9; /* سبز روشن ملایم */
            color: #000000; /* رنگ متن سیاه */
            box-sizing: border-box;
            font-size: 17px;
            font-weight: bold;
            transition: .3s;
        }

        /* وقتی کاربر روی کادر کلیک میکند پس‌زمینه سفید خالص می‌شود */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border: 2px solid #009688;
            background-color: #ffffff; /* سفید خالص */
            color: #000000;
            box-shadow: 0 0 12px rgba(0, 150, 136, 0.3);
        }

        /* استایل متن پِلیس‌هولدر داخل کادرها */
        input::placeholder, textarea::placeholder {
            color: #757575;
            font-weight: normal;
        }

        select option {
            background: #ffffff;
            color: #000000;
        }

        textarea {
            resize: none;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #00cbaf, #009688);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 15px rgba(0, 150, 136, 0.3);
            margin-top: 10px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #009688, #00796b);
            box-shadow: 0 8px 22px rgba(0, 150, 136, 0.4);
            transform: translateY(-2px);
        }

        .info {
            padding: 30px 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            background: #f9f9f9;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .number {
            font-size: 22px;
            color: #00796b;
            font-weight: bold;
            margin-top: 6px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .social-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .call-btn, .tg-btn {
            flex: 1;
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            transition: .3s;
            text-align: center;
        }

        .call-btn {
            background: #e0f2f1;
            color: #00796b;
            border: 1px solid #b2dfdb;
        }

        .call-btn:hover {
            background: #00796b;
            color: white;
            box-shadow: 0 5px 15px rgba(0,121,107,0.2);
        }

        .tg-btn {
            background: #e1f5fe;
            color: #0288d1;
            border: 1px solid #b3e5fc;
        }

        .tg-btn:hover {
            background: #0288d1;
            color: white;
            box-shadow: 0 5px 15px rgba(2,136,209,0.2);
        }

        .site-btn {
            display: inline-block;
            width: 80%;
            padding: 14px 20px;
            background: #78909c;
            color: white;
            border: none;
            text-decoration: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            transition: .3s;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .site-btn:hover {
            background: #455a64;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .share-box {
            margin-top: 25px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 14px;
            border: 1px solid #e0e0e0;
        }

        .share-box p {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: #616161;
        }

        .share-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .share-link {
            flex: 1;
            padding: 10px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
            text-align: center;
        }

        .share-wa { background: #e8f5e9; border: 1px solid #4caf50; color: #2e7d32; }
        .share-tg { background: #e1f5fe; border: 1px solid #03a9f4; color: #0277bd; }
        .share-wa:hover { background: #4caf50; color: white; }
        .share-tg:hover { background: #03a9f4; color: white; }

        .footer {
            text-align: center;
            color: #757575;
            font-size: 15px;
            margin-top: 25px;
            line-height: 1.8;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 65px;
            height: 65px;
            background: #4caf50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            text-decoration: none;
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 999;
            transition: .3s;
        }

        .whatsapp-float:hover { transform: scale(1.1) rotate(10deg); }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <img src="logo.png" class="logo">
            <h1>تاکسی VIP حسنی</h1>
            <p>سفر راحت، سریع و مطمئن<br>هرات ← مشهد</p>
            <div id="clock"></div>
        </div>

        <div class="car"></div>

        <div class="form-box">
            <label>نام و نام خانوادگی</label>
            <input type="text" id="name" placeholder="نام کامل شما">

            <label>شماره تماس</label>
            <input type="tel" id="phone" placeholder="0780xxxxxx">

            <label>مسیر سفر</label>
            <select id="route">
                <option value="هرات-مشهد">هرات ← مشهد</option>
                <option value="مشهد-هرات">مشهد ← هرات</option>
            </select>

            <label>تعداد مسافر</label>
            <select id="passengers">
                <option value="1">1 نفر</option>
                <option value="2">2 نفر</option>
                <option value="3">3 نفر</option>
                <option value="4">4 نفر</option>
            </select>

            <label>نوع خودرو</label>
            <select id="carType">
                <option value="معمولی">VIP معمولی</option>
                <option value="لوکس">VIP لوکس</option>
                <option value="ون">ون خانوادگی</option>
            </select>

            <label>تاریخ حرکت</label>
            <input type="date" id="date">

            <label>محل دقیق سوار شدن (لوکیشن / آدرس)</label>
            <textarea id="address" rows="3" placeholder="آدرس دقیق یا لینک نقشه گوگل مپ..."></textarea>

            <button class="btn" onclick="sendToWhatsApp()">ثبت رزرو در واتساپ</button>

            <div class="share-box">
                <p>این سایت را با دوستان خود به اشتراک بگذارید:</p>
                <div class="share-btns">
                    <a href="https://api.whatsapp.com/send?text=%D8%A1%20%D8%B1%D8%B2%D8%B1%D9%85%20%D8%A2%D9%86%D9%84%D8%A7%DB%8C%D9%86%20%D8%AA%D8%A7%DA%A9%D8%B3%DB%8C%20VIP%20%D8%AD%D8%B3%D9%86%DB%8C%20%D9%87%D8%B1%D8%A7%D8%AA%20%D9%85%D8%B4%D9%87%D8%AF%20%D8%A8%D9%87%20%D8%Bای%D8%AA%20%D8%B2%D9%8A%D8%B1%20%D9%85%D8%B1%D8%A7%D8%AC%D8%B9%D9%87%20%DA%A9%D9%86%DB%8C%D8%AF%3A%20https%3A%2F%2Fvip-taxi-herat-mashhad-hassani.netlify.app%2F" target="_blank" class="share-link share-wa">اشتراک در واتساپ</a>
                    <a href="https://telegram.me/share/url?url=https%3A%2F%2Fvip-taxi-herat-mashhad-hassani.netlify.app%2F&text=%D8%B1%D8%B2%D8%B1%D9%85%20%D8%A2%D9%86%D9%84%D8%A7%DB%8C%20%D8%AA%D8%A7%DA%A9%D8%B3%DB%8C%20VIP%20%D8%AD%D8%B3%D9%86%DB%8C" target="_blank" class="share-link share-tg">اشتراک در تلگرام</a>
                </div>
            </div>
        </div>

        <div class="info">
            افغانستان 🇦🇫
            <div class="number">0780889098</div>
            ایران 🇮🇷
            <div class="number">09351023670</div>

            <div class="social-box">
                <a href="tel:+93780889098" class="call-btn">📞 تماس مستقیم</a>
                <a href="https://t.me/ALIAKBAR_HASSANI" target="_blank" class="tg-btn">✈️ پیام در تلگرام</a>
            </div>
            
            <a href="https://sites.google.com/view/taxi-herat-mashhad-hassani" target="_blank" class="site-btn">🌐 ورود به سایت رسمی</a>

            <div class="footer">
                تاکسی بین‌المللی هرات مشهد حسنی<br>سفر ایمن، سریع و VIP بین هرات و مشهد
            </div>
        </div>

    </div>

    <a href="https://api.whatsapp.com/message/3YHT6E4WZFNLM1?autoload=1&app_absent=0" class="whatsapp-float" target="_blank" onclick="copyFloatMessage()">💬</a>

    <script>
        setInterval(() => {
            let now = new Date();
            document.getElementById("clock").innerHTML = now.toLocaleTimeString("fa-IR");
        }, 1000);

        function sendToWhatsApp() {
            let name = document.getElementById("name").value;
            let phone = document.getElementById("phone").value;
            let route = document.getElementById("route").value;
            let passengers = document.getElementById("passengers").value;
            let carType = document.getElementById("carType").value;
            let date = document.getElementById("date").value;
            let address = document.getElementById("address").value;

            if (name === "" || phone === "" || date === "") {
                alert("لطفاً اطلاعات ضروری (نام، شماره تماس و تاریخ) را کامل کنید.");
                return;
            }

            let message = ✨ رزرو جدید تاکسی VIP\n\n👤 نام:\n${name}\n\n📞 شماره تماس:\n${phone}\n\n🗺️ مسیر:\n${route === 'هرات-مشهد' ? 'هرات ← مشهد' : 'مشهد ← هرات'}\n\n👥 تعداد مسافر:\n${passengers} نفر\n\n🚗 نوع خودرو:\nVIP ${carType}\n\n📅 تاریخ حرکت:\n${date}\n\n📍 لوکیشن یا آدرس دقیق:\n${address || 'ثبت نشده'}\n\n🌐 سایت رسمی:\nhttps://sites.google.com/view/taxi-herat-mashhad-hassani;

            navigator.clipboard.writeText(message).then(() => {
                alert("اطلاعات رزرو شما کپی شد! در صفحه بعد پیام را در چت واتساپ پیست (Paste) کنید.");
                window.open("https://api.whatsapp.com/message/3YHT6E4WZFNLM1?autoload=1&app_absent=0", "_blank");
            }).catch(err => {
                alert("در حال هدایت به واتساپ بیزینس حسنی...");
                window.open("https://api.whatsapp.com/message/3YHT6E4WZFNLM1?autoload=1&app_absent=0", "_blank");
            });
        }

        function copyFloatMessage() {
            let msg = "سلام وقت بخیر، جهت رزرو تاکسی بین‌المللی هرات مشهد پیام می‌دهم.";
            navigator.clipboard.writeText(msg);
        }
    </script>

</body>
</html>
