<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو آنلاین تاکسی حسنی VIP</title>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0d1b2a 0%, #010811 100%);
            font-family: tahoma, sans-serif;
            color: #e0e1dd;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 540px;
            margin: 40px auto;
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.15), inset 0 0 15px rgba(0, 242, 254, 0.05);
            animation: show .8s ease;
        }

        @keyframes show {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            border-bottom: 3px solid #ffd700;
            box-shadow: 0 4px 20px rgba(0, 180, 219, 0.3);
        }

        .logo {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ffd700;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 30px rgba(0, 242, 254, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
        }

        .header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 34px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .header p {
            color: #ffffff;
            margin-top: 12px;
            line-height: 1.8;
            font-size: 19px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        #clock {
            margin-top: 15px;
            font-size: 18px;
            color: #ffd700;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .car {
            width: 100%;
            height: 280px;
            background: url('logo.png') center/cover no-repeat;
            position: relative;
            box-shadow: inset 0 -50px 50px rgba(1, 8, 17, 0.9), inset 0 50px 50px rgba(1, 8, 17, 0.9);
            filter: drop-shadow(0px 0px 15px rgba(0, 242, 254, 0.3));
        }

        .form-box {
            padding: 30px;
            background: rgba(15, 32, 67, 0.5);
            border-top: 4px solid #00f2fe;
            box-shadow: inset 0 10px 20px rgba(0, 242, 254, 0.05);
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #00f2fe;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.2);
        }

        input, select, textarea {
            width: 100%;
            padding: 16px;
            margin-bottom: 22px;
            border: 2px solid #00b4db;
            border-radius: 14px;
            background-color: #e8f5e9;
            color: #000000;
            box-sizing: border-box;
            font-size: 17px;
            font-weight: bold;
            transition: .3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border: 2px solid #ffd700;
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        input::placeholder, textarea::placeholder {
            color: #666666;
            font-weight: normal;
        }

        select option {
            background: #ffffff;
            color: #000000;
        }

        textarea {
            resize: none;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #00f2fe, #0072ff);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            margin-top: 10px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0072ff, #00f2fe);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.7);
            transform: translateY(-2px);
        }

        .info {
            padding: 30px 20px;
            border-top: 2px solid rgba(0, 242, 254, 0.2);
            text-align: center;
            background: #0b132b;
            font-size: 18px;
            font-weight: bold;
            color: #e0e1dd;
        }

        .number {
            font-size: 24px;
            color: #ffd700;
            font-weight: bold;
            margin-top: 6px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .social-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .call-btn, .tg-btn {
            flex: 1;
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            transition: .3s;
            text-align: center;
        }

        .call-btn {
            background: rgba(0, 180, 219, 0.1);
            color: #00f2fe;
            border: 1px solid #00b4db;
        }

        .call-btn:hover {
            background: #00b4db;
            color: white;
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
        }

        .tg-btn {
            background: rgba(2, 136, 209, 0.1);
            color: #29b6f6;
            border: 1px solid #0288d1;
        }

        .tg-btn:hover {
            background: #0288d1;
            color: white;
            box-shadow: 0 0 15px rgba(2, 136, 209, 0.4);
        }

        .site-btn {
            display: inline-block;
            width: 80%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #1c2541, #3a506b);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-decoration: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            transition: .3s;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .site-btn:hover {
            background: #ffd700;
            color: #010811;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .share-box {
            margin-top: 25px;
            padding: 15px;
            background: rgba(1, 8, 17, 0.5);
            border-radius: 14px;
            border: 1px solid rgba(0, 242, 254, 0.15);
        }

        .share-box p {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: #a5a5a5;
        }

        .share-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .share-link {
            flex: 1;
            padding: 10px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
            text-align: center;
        }

        .share-wa { background: rgba(76, 175, 80, 0.1); border: 1px solid #4caf50; color: #4caf50; }
        .share-tg { background: rgba(3, 169, 244, 0.1); border: 1px solid #03a9f4; color: #03a9f4; }
        .share-wa:hover { background: #4caf50; color: white; }
        .share-tg:hover { background: #03a9f4; color: white; }

        .footer {
            text-align: center;
            color: #8d99ae;
            font-size: 15px;
            margin-top: 25px;
            line-height: 1.8;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 65px;
            height: 65px;
            background: #4caf50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            text-decoration: none;
            color: white;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            z-index: 999;
            transition: .3s;
        }

        .whatsapp-float:hover { transform: scale(1.1) rotate(10deg); box-shadow: 0 0 30px rgba(76, 175, 80, 0.8); }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <img src="logo.png" class="logo">
            <h1>تاکسی VIP حسنی</h1>
            <p>سفر راحت، سریع و مطمئن<br>هرات ← مشهد</p>
            <div id="clock"></div>
        </div>

        <div class="car"></div>

        <div class="form-box">
            <label>نام و نام خانوادگی</label>
            <input type="text" id="name" placeholder="نام کامل شما">

            <label>شماره تماس</label>
            <input type="tel" id="phone" placeholder="0780xxxxxx">

            <label>مسیر سفر</label>
            <select id="route">
                <option value="هرات-مشهد">هرات ← مشهد</option>
                <option value="مشهد-هرات">مشهد ← هرات</option>
            </select>

            <label>تعداد مسافر</label>
            <select id="passengers">
                <option value="1">1 نفر</option>
                <option value="2">2 نفر</option>
                <option value="3">3 نفر</option>
                <option value="4">4 نفر</option>
            </select>

            <label>نوع خودرو</label>
            <select id="carType">
                <option value="معمولی">VIP معمولی</option>
                <option value="لوکس">VIP لوکس</option>
                <option value="ون">ون خانوادگی</option>
            </select>

            <label>تاریخ حرکت</label>
            <input type="date" id="date">

            <label>محل دقیق برای سوار شدن از آدرس و یا لوکیشن</label>
            <textarea id="address" rows="3" placeholder="بخش توضیحات ویا ادرس دقیق یا لینک نقشه گوگل مپس مسافر"></textarea>

            <button class="btn" onclick="sendToWhatsApp()">ثبت رزرو در واتساپ</button>

            <div class="share-box">
                <p>این سایت را با دوستان خود به اشتراک بگذارید:</p>
                <div class="share-btns">
                    <a href="https://api.whatsapp.com/send?text=%D8%A8%D8%B1%D8%A7%DB%8C%20%D8%B1%D8%B2%D8%B1%D9%88%20%D8%AA%D8%A7%DA%A9%D8%B3%DB%8C%20%D9%87%D8%B1%D8%A7%D8%AA%20%D9%85%D9%8B%D9%87%D8%AF%20%D8%AD%D8%B3%D9%86%DB%8C%20%DA%A9%D9%84%DB%8C%DA%A9%20%DA%A9%D9%86%DB%8C%D8%AF%3A%20https%3A%2F%2Fvip-taxi-herat-mashhad-hassani.netlify.app%2F" target="_blank" class="share-link share-wa">اشتراک در واتساپ</a>
                    <a href="https://telegram.me/share/url?url=https%3A%2F%2Fvip-taxi-herat-mashhad-hassani.netlify.app%2F&text=%D8%A8%D8%B1%D8%A7%DB%8C%20%D8%B1%D8%B2%D8%B1%D9%88%20%D8%AA%D8%A7%DA%A9%D8%B3%DB%8C%20%D9%87%D8%B1%D8%A7%D8%AA%20%D9%85%D8%B4%D9%87%D8%AF%20%D8%AD%D8%B3%D9%86%DB%8C%20%DA%A9%D9%84%DB%8C%DA%A9%20%DA%A9%D9%86%DB%8C%D8%AF" target="_blank" class="share-link share-tg">اشتراک در تلگرام</a>
                </div>
            </div>
        </div>

        <div class="info">
            افغانستان 🇦🇫
            <div class="number">0780889098</div>
            ایران 🇮🇷
            <div class="number">09351023670</div>

            <div class="social-box">
                <a href="tel:+93780889098" class="call-btn">📞 تماس مستقیم</a>
                <a href="https://t.me/ALIAKBAR_HASSANI" target="_blank" class="tg-btn">✈️ پیام در تلگرام</a>
            </div>
            
            <a href="https://sites.google.com/view/taxi-herat-mashhad-hassani" target="_blank" class="site-btn">🌐 ورود به سایت رسمی</a>

            <div class="footer">
                تاکسی بین‌المللی هرات مشهد حسنی<br>سفر ایمن، سریع و VIP بین هرات و مشهد
            </div>
        </div>

    </div>

    <a href="https://api.whatsapp.com/message/3YHT6E4WZFNLM1?autoload=1&app_absent=0" class="whatsapp-float" target="_blank">💬</a>

    <script>
        setInterval(() => {
            let now = new Date();
            document.getElementById("clock").innerHTML = now.toLocaleTimeString("fa-IR");
        }, 1000);

        function sendToWhatsApp() {
            let name = document.getElementById("name").value;
            let phone = document.getElementById("phone").value;
            let route = document.getElementById("route").value;
            let passengers = document.getElementById("passengers").value;
            let carType = document.getElementById("carType").value;
            let date = document.getElementById("date").value;
            let address = document.getElementById("address").value;

            if (name === "" || phone === "" || date === "") {
                alert("لطفاً اطلاعات ضروری (نام، شماره تماس و تاریخ) را کامل کنید.");
                return;
            }

            // تنظیم ساختار متن فرم رزرو مسافر
            let message = ✨ رزرو جدید تاکسی VIP\n\n👤 نام:\n${name}\n\n📞 شماره تماس:\n${phone}\n\n🗺️ مسیر:\n${route === 'هرات-مشهد' ? 'هرات ← مشهد' : 'مشهد ← هرات'}\n\n👥 تعداد مسافر:\n${passengers} نفر\n\n🚗 نوع خودرو:\nVIP ${carType}\n\n📅 تاریخ حرکت:\n${date}\n\n📍 محل دقیق سوار شدن یا توضیحات:\n${address || 'ثبت نشده'}\n\n🌐 سایت رسمی:\nhttps://sites.google.com/view/taxi-herat-mashhad-hassani;

            // کدگذاری متن برای ارسال ایمن بدون تداخل ساختاری
            let encodedMessage = encodeURIComponent(message);
            
            // پیوند دادن اطلاعات فرم کدگذاری شده به انتهای لینک اختصاصی بیزینس شما
            let whatsappUrl = https://api.whatsapp.com/message/3YHT6E4WZFNLM1?autoload=1&app_absent=0&text=${encodedMessage};
            
            window.open(whatsappUrl, "_blank");
        }
    </script>

</body>
</html>
